# camp release workflow: copy to .github/workflows/camp-release.yml in your
# plugin repository, unchanged. Publishing to camp is then `git tag v1.2.3 &&
# git push --tags`. Everything happens in the maintained reusable workflow
# (camp-registry/camp-workflows), so fixes reach you without re-copying.
# Docs: https://github.com/camp-registry/camp-docs/blob/main/AUTHORS.md
name: Publish release to camp
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
jobs:
  camp:
    uses: camp-registry/camp-workflows/.github/workflows/release.yml@v1
