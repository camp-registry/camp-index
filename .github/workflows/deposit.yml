# Manual archive operations (D22): bootstrap the append-only artifact
# archive, or re-run a deposit/audit outside the publish cycle. The
# publish pipeline runs deposit+audit on every trigger once the serving
# cutover lands; this workflow exists for the bootstrap and for humans.

name: Artifact archive (deposit + audit)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deposit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install camp tools (archive extra)
        run: |
          # camp-tools pin: tag and commit in .camp-tools-version at the root (camp-index#521)
          read -r tag sha < .camp-tools-version
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::.camp-tools-version is malformed: '$tag $sha'"; exit 1; }
          pip install --quiet "camp-tools[archive] @ git+https://github.com/camp-registry/camp-tools@${sha}"

      - name: Deposit every ledger release
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ vars.B2_BUCKET }}
          B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
        run: camp deposit . --bucket "$B2_BUCKET" --endpoint "$B2_ENDPOINT"

      - name: Audit the archive against the ledger
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ vars.B2_BUCKET }}
          B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
        run: camp archive-audit . --bucket "$B2_BUCKET" --endpoint "$B2_ENDPOINT"
