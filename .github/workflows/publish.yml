# Publish the rendered repository (RFC §4.5) on every index change.
#
# Generates the distribution tree from the index — the browse website,
# Composer metadata, the advisory feed, and the JSON Schemas at /schema/
# (so the schemas' $id URLs resolve) — and deploys it to GitHub Pages.
#
# Pages is the interim origin while the artifact tree is empty. When
# verified releases start landing, the origin moves to a host that can
# serve large artifact trees and offer rsync for mirrors (MIRRORING.md);
# this workflow's generate step stays the same and only the deploy step
# changes.

name: Publish site + repository metadata

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "utilities/**"
      - "advisories/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"   # keeps generated-at-publish data fresh
    - cron: "23 17 * * *"  # second re-sign of the TUF timestamp (14-day
                           # window; camp-tools#47 phase 2). GitHub's
                           # scheduler runs hours late; the slack absorbs it.
                            # (relative dates, health dots, fetched badges)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  BASE_URL: https://camp-registry.org
  ARTIFACTS_BASE: https://artifacts.camp-registry.org

jobs:
  build:
    # Runs only in the canonical repository: a fork with Actions enabled
    # would otherwise run this on schedule (and fail its Pages deploy).
    if: github.repository == 'camp-registry/camp-index'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # AUTHORS.md renders as /authors.html — single-sourced from
      # camp-docs so the site never drifts from the canonical guide.
      - uses: actions/checkout@v7
        with:
          repository: camp-registry/camp-docs
          path: docs-repo

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install camp tools
        run: pip install --quiet "camp-tools[screenshots,archive,signing] @ git+https://github.com/camp-registry/camp-tools@v0.2.68"

      - name: Setup PHP (code checks)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer

      - name: Install Moodle Code Checker
        run: |
          composer global config --no-interaction allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --quiet moodlehq/moodle-cs
          echo "$(composer global config bin-dir --absolute --quiet)" >> "$GITHUB_PATH"

      # Moodle grunt rig for the AMD rebuild verdicts (camp-tools#4): a
      # pinned checkout with node_modules, cached across publishes; a
      # cache miss costs one clone plus npm ci. When the branch or node
      # version here moves, bump CHECKER_VERSION in camp-tools with it —
      # rebuild verdicts are only deterministic against a fixed rig.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore Moodle rig
        id: rig-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/moodle-rig
          key: moodle-rig-MOODLE_405_STABLE-node22-v1

      - name: Build Moodle rig
        if: steps.rig-cache.outputs.cache-hit != 'true'
        run: |
          git clone --quiet --depth 1 --branch MOODLE_405_STABLE \
            https://github.com/moodle/moodle "$RUNNER_TEMP/moodle-rig"
          cd "$RUNNER_TEMP/moodle-rig" && npm ci --no-audit --no-fund

      - name: Generate the distribution tree
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ vars.B2_BUCKET }}
          B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
        run: |
          # Per-version code-check summaries (published at /checks/ for
          # transparency; also feeds the site's chips and badges). Results
          # are commit-deterministic: the previous publish is the cache,
          # so only new releases are actually analyzed.
          camp checks . dist/checks --reuse "$BASE_URL/checks" \
            --moodle-rig "$RUNNER_TEMP/moodle-rig"

          # Ingest listing manifests + screenshots from each released
          # plugin's repo at the ledger commit (pinned, sanitized).
          # Entries unchanged since the last publish are refetched from
          # the live site (pin re-checked) instead of cloned.
          camp ingest-all . --out "$RUNNER_TEMP/listings" --reuse "$BASE_URL"

          # The archive (D22): deposit any new ledger releases (append-only,
          # compliance-locked), then audit that every release is archived
          # hash-exact — a hole turns this publish red.
          camp deposit . --bucket "$B2_BUCKET" --endpoint "$B2_ENDPOINT"
          # The audit also records each stored ZIP's byte length: the
          # signed targets need length + hash, the ledger holds the hash.
          camp archive-audit . --bucket "$B2_BUCKET" --endpoint "$B2_ENDPOINT" \
            --lengths-out "$RUNNER_TEMP/artifact-lengths.json"

          # The browse site lives at the tree root: / is the browse page,
          # /plugin/... the detail pages, machine paths alongside.
          camp site . "$BASE_URL" dist --listings "$RUNNER_TEMP/listings" --checks dist/checks \
            --reviews https://mdlshield.com/api/reviews/published \
            --artifacts-base "$ARTIFACTS_BASE" \
            --authors-md docs-repo/AUTHORS.md \
            --installing-md docs-repo/INSTALLING.md
          # Publish the ingested listings + manifest so the next publish
          # can reuse them (screenshots already ship at /shots/).
          mkdir -p dist/listings
          find "$RUNNER_TEMP/listings" -maxdepth 1 -type f -exec cp {} dist/listings/ \;

          camp composer . "$BASE_URL" dist/packages.json --artifacts-base "$ARTIFACTS_BASE"

      # TUF phase 2 (camp-tools#47): sign what clients install with the
      # online keys the steward-signed root lists, and serve the metadata
      # beside the tree at /tuf/. Targets: the site's machine-readable files
      # (hashed here) + every served ledger release (hash from the ledger,
      # length from the audit above). Version numbers continue across
      # runs, so the live metadata is fetched first; the root is canonical
      # in this repository's tuf/ and never regenerated here. A verify that
      # fails leaves this run red and nothing deploys.
      - name: Sign the published tree
        env:
          TUF_TARGETS_KEY: ${{ secrets.TUF_TARGETS_KEY }}
          TUF_SNAPSHOT_KEY: ${{ secrets.TUF_SNAPSHOT_KEY }}
          TUF_TIMESTAMP_KEY: ${{ secrets.TUF_TIMESTAMP_KEY }}
          # Windows decided 2026-09-25 (timestamp 14 / snapshot 30 / targets
          # 90; root as set at the ceremony). Change here, no train needed.
          TUF_EXPIRY_TIMESTAMP: "14"
          TUF_EXPIRY_SNAPSHOT: "30"
          TUF_EXPIRY_TARGETS: "90"
        run: |
          mkdir -p dist/tuf "$RUNNER_TEMP/tuf-keys"
          for role in targets snapshot timestamp; do
            curl -fsS -m 20 "$BASE_URL/tuf/$role.json" -o "dist/tuf/$role.json" \
              || echo "no live $role.json yet (first signing run)"
          done
          # Keep the outgoing versioned targets/snapshot files one more cycle:
          # a client that read the old timestamp just before this deploy can
          # still fetch the <version>.<role>.json it names instead of a 404.
          for role in targets snapshot; do
            [ -f "dist/tuf/$role.json" ] || continue
            v=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['signed']['version'])" "dist/tuf/$role.json")
            curl -fsS -m 20 "$BASE_URL/tuf/$v.$role.json" -o "dist/tuf/$v.$role.json" \
              || echo "no live $v.$role.json to carry over"
          done
          cp tuf/root.json tuf/*.root.json dist/tuf/
          printf '%s\n' "$TUF_TARGETS_KEY"   > "$RUNNER_TEMP/tuf-keys/targets.pem"
          printf '%s\n' "$TUF_SNAPSHOT_KEY"  > "$RUNNER_TEMP/tuf-keys/snapshot.pem"
          printf '%s\n' "$TUF_TIMESTAMP_KEY" > "$RUNNER_TEMP/tuf-keys/timestamp.pem"
          chmod 600 "$RUNNER_TEMP"/tuf-keys/*.pem
          camp tuf sign dist "$RUNNER_TEMP/tuf-keys" dist/tuf \
            --only packages.json --only security-advisories.json --only index.json \
            --index . --artifact-lengths "$RUNNER_TEMP/artifact-lengths.json" \
            --expiry "timestamp=$TUF_EXPIRY_TIMESTAMP" \
            --expiry "snapshot=$TUF_EXPIRY_SNAPSHOT" \
            --expiry "targets=$TUF_EXPIRY_TARGETS"
          rm -rf "$RUNNER_TEMP/tuf-keys"
          camp tuf verify dist/tuf dist --missing-ok-suffix .zip

      - name: Finish the distribution tree
        run: |
          # The author templates are served from the site too, so tools that
          # scaffold plugins (mdlcode and the like) fetch the six-line caller
          # from a domain we control: /templates/camp-release.yml.
          mkdir -p dist/templates
          cp templates/*.yml dist/templates/
          # ... and the six-line caller must still match what the reusable
          # workflow expects and what the docs show (see the script).
          python .github/scripts/check-caller-template.py \
            templates/camp-release.yml docs-repo/AUTHORS.md
          python -c "
          import camp, pathlib, shutil
          shutil.copytree(pathlib.Path(camp.__file__).parent / 'schema', 'dist/schema')
          "
          # Transitional: /site/ served the browse page for the first day.
          # A plain link, not an auto-redirect: day-one visitors may still
          # have the old root page (which pointed here) in browser cache,
          # and two instant redirects aimed at each other loop.
          mkdir -p dist/site
          cat > dist/site/index.html <<'EOF'
          <!DOCTYPE html><title>camp</title>
          <p>The site moved to the domain root:
          <a href="https://camp-registry.org/">camp-registry.org</a></p>
          EOF
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # Runs only in the canonical repository: a fork with Actions enabled
    # would otherwise run this on schedule (and fail its Pages deploy).
    if: github.repository == 'camp-registry/camp-index'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify the live site is fresh, then dead-man ping
        # The ping tells healthchecks.io "a publish reached visitors".
        # Missed pings (dead cron, red run, broken deploy) alert David
        # from OUTSIDE GitHub — a monitor inside our own cron would die
        # of the same disease it watches for.
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
        run: |
          for i in $(seq 1 10); do
            built=$(curl -fsS -m 15 https://camp-registry.org/version.json               | python3 -c "import json,sys; print(json.load(sys.stdin)['built'])") || built=""
            if [ -n "$built" ]; then
              age=$(( $(date -u +%s) - $(date -u -d "$built" +%s) ))
              echo "live built: $built (${age}s ago)"
              [ "$age" -lt 1800 ] && fresh=1 && break
            fi
            sleep 20
          done
          [ "${fresh:-}" = "1" ] || { echo "live site never showed a fresh build"; exit 1; }
          if [ -n "$HC_PING_URL" ]; then
            curl -fsS -m 10 --retry 3 "$HC_PING_URL" > /dev/null && echo "pinged"
          else
            echo "no HC_PING_URL secret yet; freshness verified, ping skipped"
          fi
