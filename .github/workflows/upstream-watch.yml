# Weekly: compare our Moodle-branch table against moodle/moodle's actual
# stable branches. A new branch (e.g. 5.3) files ONE issue carrying the
# ready-made BRANCHES row — the human step is adding it and shipping.

name: Upstream Moodle watch

on:
  workflow_dispatch:
  schedule:
    - cron: "11 4 * * 1"   # Mondays

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install camp tools
        run: pip install --quiet "git+https://github.com/camp-registry/camp-tools@v0.2.46"

      - name: Check branch table against upstream
        id: check
        run: |
          set +e
          out=$(camp check-moodle-branches 2>&1)
          code=$?
          # Standard-components drift (camp-tools#25) and plugin-type
          # drift (camp-tools#16) ride the same weekly cadence and the
          # same issue; any table drifting files it.
          out2=$(camp check-standard-plugins 2>&1)
          code2=$?
          out3=$(camp check-plugin-types 2>&1)
          code3=$?
          out=$(printf '%s\n%s\n%s' "$out" "$out2" "$out3")
          echo "$out"
          {
            echo "findings<<CAMPEOF"
            echo "$out"
            echo "CAMPEOF"
          } >> "$GITHUB_OUTPUT"
          if [ $code -ne 0 ] || [ $code2 -ne 0 ] || [ $code3 -ne 0 ]; then exit 1; fi
          exit 0

      - name: File the issue (once)
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "Upstream Moodle drift detected in:title" --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "issue already open; not duplicating"
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Upstream Moodle drift detected" \
            --body "The weekly upstream watch found camp's tables out of date with moodle/moodle:

          \`\`\`
          ${{ steps.check.outputs.findings }}
          \`\`\`

          For a new stable branch: add the suggested row(s) to \`BRANCHES\` in \`camp/moodleversions.py\`, review the index-pr matrix endpoints and anything else branch-aware. For standard-components drift: review the diff and refresh with \`camp check-standard-plugins --write\` (camp-tools#25). For plugin-type drift: refresh with \`camp check-plugin-types --write\` and name any new type in the display overlay (camp-tools#16; the tests enforce it). Ship as usual. (VORDER derives automatically.)"
