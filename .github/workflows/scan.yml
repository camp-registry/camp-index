# Monthly discovery scan: finds new public Moodle plugin repositories on
# GitHub and GitLab.com, writes Tier 0 listings for eligible ones, and
# records every evaluated repository in the scan ledger, including
# component-name collisions (copy / name-collision outcomes, NAMESPACE.md
# in camp-docs). Ledger entries younger than the recheck window are
# skipped, so the steady-state cost is the new-repo tail, not the catalog.
# Pushes directly to main as the camp-registry-automation app, the same
# non-human identity the metrics refresh uses.

name: Discovery scan

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max results per GitHub search query"
        default: "200"
      recheck-days:
        description: "Re-evaluate ledger entries older than this many days"
        default: "45"
      dry-run:
        description: "Report without writing entries (true/false)"
        default: "false"
  schedule:
    - cron: "23 2 3 * *"   # monthly on the 3rd, ahead of the daily publish

permissions:
  contents: read           # pushes use the app token, not GITHUB_TOKEN
  issues: write            # family-establishment issues (camp-tools#16)

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Mint app token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      # No persisted credentials: the job-start token expires after one
      # hour and a full sweep runs longer, so the push authenticates with
      # a fresh token minted at push time instead.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install camp tools
        run: pip install --quiet "camp-tools @ git+https://github.com/camp-registry/camp-tools@v0.2.53"

      # inputs are empty on schedule runs; the fallbacks keep the cron
      # behavior identical to the dispatch defaults. 45-day recheck on a
      # monthly cadence means known repos are re-evaluated roughly every
      # other run; brand-new repos are always evaluated.
      - name: Scan GitHub
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: >
          camp scan .
          --limit ${{ inputs.limit || '200' }}
          --recheck-days ${{ inputs.recheck-days || '45' }}
          ${{ inputs.dry-run == 'true' && '--dry-run' || '' }}

      # GITHUB_TOKEN is also set here: the collision classifier probes the
      # GitHub API when the listed holder of a component lives there.
      # GitLab search itself runs unauthenticated (rate-limit tolerant).
      - name: Scan GitLab
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: >
          camp scan-gitlab .
          --recheck-days ${{ inputs.recheck-days || '45' }}
          ${{ inputs.dry-run == 'true' && '--dry-run' || '' }}

      # App installation tokens live one hour; a multi-hour sweep outlives
      # the token minted at job start (the first real run died exactly
      # here), so the push gets its own freshly minted token.
      - name: Mint push token
        id: push-app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Push new listings and ledger
        run: |
          git add plugins discovery
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git config user.name "camp project"
          git config user.email "noreply@camp-registry.org"
          git commit -m "discovery scan (scheduled)"
          # main moves during a multi-hour sweep (enrich, claims, release
          # PRs); replay our commit on top so the push isn't rejected as
          # non-fast-forward. Anonymous read works on a public repo.
          git pull --rebase origin main
          git push "https://x-access-token:${{ steps.push-app.outputs.token }}@github.com/${{ github.repository }}.git" HEAD:main

      # First contact with an unknown plugin-type prefix parks its members
      # in needs-review instead of auto-listing (camp-tools#16). Each new
      # family gets ONE issue, and that issue thread is the establishment
      # record: the review's verdict and the subplugin-families.yml commit
      # both point back at it. Dedup searches all issue states so a
      # reviewed-and-rejected family is not re-filed every month;
      # established families drop out of the report by themselves.
      - name: File family-establishment issues
        if: inputs.dry-run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          camp unknown-type-families . | while IFS=$'\t' read -r prefix count repos detail; do
            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all \
              --search "\"New subplugin family detected: $prefix\" in:title" \
              --json number --jq 'length')
            if [ "$existing" -gt 0 ]; then
              echo "$prefix: issue exists; skipping"
              continue
            fi
            members=$(echo "$repos" | tr ',' '\n' | sed 's/^/- /')
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "New subplugin family detected: $prefix" \
              --body "The discovery scan met components with the unknown plugin-type prefix \`$prefix\` and parked them in needs-review instead of listing them (scanner evidence: $detail).

          Members waiting:

          $members

          This needs one family-establishment review (camp-registry/camp-tools#16): decide whether \`$prefix\` is a subplugin family meant for separate distribution. Independent authors publishing members from their own repositories is the usual positive signal; members that only live inside the parent's repository are internal decomposition and do not list. To establish, add a record for \`$prefix\` (parent, display name, this issue's URL) to \`discovery/subplugin-families.yml\` and close this issue; parked members relist automatically on the next scan's recheck window. To reject, close with the reason; the members stay parked."
          done
