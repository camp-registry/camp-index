summary: Largebackup ist ein lokales Moodle-Plugin zum Hochladen großer Moodle-Kurssicherungen
  (.mbz). Die Dateien werden in mehreren Teilen (Chunks) übertragen. Nach dem Upload
  öffnet das Plugin den Moodle-Wiederherstellungsassistenten.
