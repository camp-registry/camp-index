- github: tanmaytdwork
tier: 0
status: active
discovered: '2026-07-11'
releases: []
license: GPL-3.0
summary: A Moodle local plugin that permanently archives modcustomcert certificate
  issuances as immutable snapshots. When a course or certificate activity is deleted,
  Moodle's built-in "My certificates" page silently drops those records — this plugin
  prevents that data loss entirely.
dependencies:
  mod_customcert: 2024042217
