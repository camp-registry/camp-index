summary: StudyBuddy is a Moodle local plugin for AI-assisted study workflows grounded
  in course materials. It combines RAG chat, source indexing, temporary student self-assessment
  quizzes, and teacher-reviewed quiz drafts that can be published as native Moodle
  quiz activities.
