summary: Moodle Grade Book Reset is a Moodle Admin Tool plugin, which resets course
  user’s grades from the gradebook. Multiple users can be selected at once to reset
  their grades. It resets manually added, hidden, overridden, excluded and locked
  grades of all the activities under a course.
