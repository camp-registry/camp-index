summary: Moodle activity plugin. Lets teacher distribute Jupyter .ipynb notebooks
  as assignments, student runs them in Google Colab (Google's infra, free), Drive
  stores files, plugin pulls submission back and renders outputs (tables, plots, errors)
  inline in Moodle for grading.
